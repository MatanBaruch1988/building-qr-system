<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="light dark" />
    <!-- Light / dark, applied before the first paint so there is no flash of the wrong one. Same logic as
         src/ui/theme.js (the key, the three values): tests/theme.test.js keeps them in step. It is a file and not an
         inline script, because the Content-Security-Policy (vercel.json) allows no inline script. A plain classic tag
         (no async, no defer, no type) blocks the parser, so it runs before the first paint and before the module script. -->
    <script src="/theme-boot.js"></script>
    <meta name="description" content="רישום נוכחות נותני שירות בבניין באמצעות QR" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="נוכחות" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>נוכחות בבניין</title>
    <!-- No external stylesheets: the Heebo font is bundled (main.jsx) and the map CSS ships with the committee
         app only, so first paint never waits on a third-party server, even on one bar of signal. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
