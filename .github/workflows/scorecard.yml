# OpenSSF Scorecard: an automated check of the repository's security habits (pinned actions, branch protection, a
# security policy, dependency updates, signed releases and so on). It is based on the workflow in the Scorecard
# project's own repository.
# It runs after a merge to the default branch (master here, often main in a copy) and once a week, not on pull requests,
# so it never blocks a change: it reports on the state of the repository, it does not gate it.
# The results go to two places: the Security tab of the repository (code scanning, as SARIF) and, because
# publish_results is on, the public Scorecard page and the badge in README.md.
# Every third-party action is pinned to a full commit SHA (the tag is in the comment), like in ci.yml.
#
# This file must stay as plain as it is. With publish_results on, the Scorecard API refuses a run when the workflow has
# a top-level or job-level `env` or `defaults`, a container or a service, or any action other than the four below.
name: Scorecard

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "30 1 * * 6" # Saturday, 01:30 UTC

# Nothing is writable unless a job asks for it.
permissions: read-all

jobs:
  analysis:
    name: analysis
    # The push trigger lists two names, but the job (and its write permissions below) runs only for the default branch, the
    # one the rulesets protect: a push to an unprotected branch that happens to be named master or main runs nothing. It is
    # the condition of GitHub's starter workflow for Scorecard; a scheduled run is on the default branch, so it passes.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job that lists permissions gets none of the others, so the read access to the code is listed too.
    permissions:
      # Read the repository (actions/checkout).
      contents: read
      # Upload the results to the Security tab (code scanning).
      security-events: write
      # Publish the results to the Scorecard API and get the badge: the action proves who it is with an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # Keep a copy of the results with the run, for a few days.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
